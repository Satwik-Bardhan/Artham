[versions]
agp = "9.3.0"
kotlin = "2.2.10"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.1"
lifecycleViewmodel = "2.11.0"
lifecycleLivedata = "2.11.0"
lifecycleCommonJava8 = "2.11.0"
recyclerview = "1.3.2"
cardview = "1.0.0"
swiperefreshlayout = "1.2.0"
viewbinding = "8.13.2"

# Google
playServicesAuth = "21.6.0"
playServicesLocation = "21.4.0"

# Google Play Libraries
playReview = "2.0.2"
appUpdate = "2.1.0"

# Third-party libraries
mpandroidchart = "3.1.0"
quadflaskColorpicker = "0.0.15"
dhavalColorpicker = "2.3"
glide = "4.16.0"
itextpdf = "5.5.13.3"
skydovesColorpicker = "2.2.4"
shimmer = "0.5.0"
gson = "2.14.0"
room = "2.7.1"
workManager = "2.10.1"
supabase = "3.1.4"
ktor = "3.1.3"
kotlinxSerializationJson = "1.8.1"
kotlinxCoroutinesAndroid = "1.10.2"

[libraries]
# --- AndroidX & UI Core ---
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
androidx-swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-databinding-viewbinding = { group = "androidx.databinding", name = "viewbinding", version.ref = "viewbinding" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# --- Lifecycle ---
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycleViewmodel" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycleLivedata" }
androidx-lifecycle-common-java8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycleCommonJava8" }

# --- Firebase removed: All data now uses Room + Supabase ---

# --- Google Play Services ---
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

# --- Google Play Libraries ---
play-review = { group = "com.google.android.play", name = "review", version.ref = "playReview" }
play-review-ktx = { group = "com.google.android.play", name = "review-ktx", version.ref = "playReview" }
app-update = { group = "com.google.android.play", name = "app-update", version.ref = "appUpdate" }
app-update-ktx = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "appUpdate" }

# --- Third Party Libraries ---
mpandroidchart = { group = "com.github.PhilJay", name = "MPAndroidChart", version.ref = "mpandroidchart" }
quadflask-colorpicker = { group = "com.github.QuadFlask", name = "colorpicker", version.ref = "quadflaskColorpicker" }
dhaval-colorpicker = { group = "com.github.Dhaval2404", name = "ColorPicker", version.ref = "dhavalColorpicker" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
itextpdf = { group = "com.itextpdf", name = "itextpdf", version.ref = "itextpdf" }
skydoves-colorpickerview = { group = "com.github.skydoves", name = "colorpickerview", version.ref = "skydovesColorpicker" }
shimmer = { group = "com.facebook.shimmer", name = "shimmer", version.ref = "shimmer" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
supabase-bom = { group = "io.github.jan-tennert.supabase", name = "bom", version.ref = "supabase" }
supabase-postgrest = { group = "io.github.jan-tennert.supabase", name = "postgrest-kt" }
supabase-gotrue = { group = "io.github.jan-tennert.supabase", name = "auth-kt" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }

# --- Testing ---
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsKotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
